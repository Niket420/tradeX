services:
  postgres:
    image: postgres:16-alpine
    container_name: tradex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradex
      POSTGRES_PASSWORD: tradex_dev_only
      POSTGRES_DB: tradex
    ports:
      - "5432:5432"
    volumes:
      - tradex_postgres_data:/var/lib/postgresql/data
    # fsync/synchronous_commit off: local dev only — trades durability for
    # speed under Docker Desktop's slow virtualized disk. Never do this in
    # production; data loss on an unclean shutdown is acceptable here since
    # this whole database is reproducible by re-running the ingest scripts.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]

volumes:
  tradex_postgres_data:
